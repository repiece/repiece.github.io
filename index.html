<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RePiece</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="top-bar">
    <nav class="plugin">
        <button data-target="smart-stroke" class="active">Smart Stroke</button>
        <button data-target="path-repeater">Path Repeater</button>
        <button data-target="boundary-fill">Boundary Fill</button>
        <button data-target="text-one">Text One</button>
        <button data-target="motion-path-stroke">Motion Path Stroke</button>
        <!-- 💡 text_fill -> text-fill 로 변경하여 ID와 일치시킴 -->
        <button data-target="text-fill">Text Fill</button>
    </nav>

    <div class="language-select">
        <select id="language">
            <option value="ko">한국어</option>
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </div>
</header>

<main>
<nav class="sub-nav">
    <button data-sub="quick"></button>
    <button data-sub="params"></button>
    <button data-sub="faq"></button>
</nav>

    <!-- 🔹 Smart Stroke -->
    <section id="smart-stroke" class="content-section active">
        <h2>Smart Stroke</h2>
        <div class="sub-content">
            <div class="sub-section active" data-sub="quick" data-i18n="smart-stroke.quick"></div>
            <div class="sub-section" data-sub="params" data-i18n="smart-stroke.params"></div>
            <div class="sub-section" data-sub="faq" data-i18n="smart-stroke.faq"></div>
        </div> <!-- 💡 닫는 태그 추가 -->
    </section>

    <!-- 🔹 Path Repeater -->
    <section id="path-repeater" class="content-section">
        <h2>Path Repeater</h2>
        <div class="sub-content">
            <div class="sub-section active" data-sub="quick" data-i18n="path-repeater.quick"></div>
            <div class="sub-section" data-sub="params" data-i18n="path-repeater.params"></div>
            <div class="sub-section" data-sub="faq" data-i18n="path-repeater.faq"></div>
        </div> <!-- 💡 <div class="sub-content"> 오타 수정 -> </div> -->
    </section>

    <!-- 🔹 Boundary Fill -->
    <section id="boundary-fill" class="content-section">
        <h2>Boundary Fill</h2>
        <div class="sub-content">
            <div class="sub-section active" data-sub="quick" data-i18n="boundary-fill.quick"></div>
            <div class="sub-section" data-sub="params" data-i18n="boundary-fill.params"></div>
            <div class="sub-section" data-sub="faq" data-i18n="boundary-fill.faq"></div>
        </div> <!-- 💡 <div class="sub-content"> 오타 수정 -> </div> -->
    </section>

    <!-- 🔹 Text One -->
    <section id="text-one" class="content-section">
        <h2>Text One</h2>
        <div class="sub-content">
            <div class="sub-section active" data-sub="quick" data-i18n="text-one.quick"></div>
            <div class="sub-section" data-sub="params" data-i18n="text-one.params"></div>
            <div class="sub-section" data-sub="faq" data-i18n="text-one.faq"></div>
        </div> <!-- 💡 <div class="sub-content"> 오타 수정 -> </div> -->
    </section>

    <!-- 🔹 Motion Path Stroke -->
    <section id="motion-path-stroke" class="content-section">
        <h2>Motion Path Stroke</h2>
        <div class="sub-content">
            <div class="sub-section active" data-sub="quick" data-i18n="motion-path-stroke.quick"></div>
            <!-- 💡 tmotion-path-stroke.params 오타 수정 -> motion-path-stroke.params -->
            <div class="sub-section" data-sub="params" data-i18n="motion-path-stroke.params"></div>
            <div class="sub-section" data-sub="faq" data-i18n="motion-path-stroke.faq"></div>
        </div> <!-- 💡 <div class="sub-content"> 오타 수정 -> </div> -->
    </section>

    <!-- 🔹 Text Fill -->
    <section id="text-fill" class="content-section">
        <h2>Text Fill</h2>
        <div class="sub-content">
            <div class="sub-section active" data-sub="quick" data-i18n="text-fill.quick"></div>
            <div class="sub-section" data-sub="params" data-i18n="text-fill.params"></div>
            <div class="sub-section" data-sub="faq" data-i18n="text-fill.faq"></div>
        </div> <!-- 💡 <div class="sub-content"> 오타 수정 -> </div> -->
    </section>
</main>

<script src="./js/main.js"></script>
</body>
</html>
